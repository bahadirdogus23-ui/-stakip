name: Windows EXE

on:
  workflow_dispatch:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install packaging tool
        run: python -m pip install -r requirements-build.txt
      - name: Run application tests
        run: python -m unittest discover -s tests -v
      - name: Verify desktop layouts and dialogs
        run: python tests/ui_smoke.py
      - name: Test waiter offline queue
        run: node tests/test_waiter.cjs
      - name: Test modern waiter UI in Microsoft Edge
        shell: pwsh
        run: |
          npm install --prefix "$env:RUNNER_TEMP/lokanta-browser" playwright-core@1.56.1 --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Browser test dependency installation failed.' }
          $env:NODE_PATH = "$env:RUNNER_TEMP/lokanta-browser/node_modules"
          python tests/run_browser_smoke.py
          if ($LASTEXITCODE -ne 0) { throw 'Waiter browser smoke test failed.' }
      - name: Build standalone desktop executable
        run: python -m PyInstaller --noconfirm --clean LokantaTakip.spec
      - name: Verify packaged Tk window, database and waiter page
        shell: pwsh
        run: |
          $process = Start-Process -FilePath .\dist\LokantaTakip.exe -ArgumentList '--self-test' -PassThru
          if (-not $process.WaitForExit(60000)) {
            $process.Kill()
            throw 'Packaged application self-test timed out.'
          }
          if ($process.ExitCode -ne 0) { throw "Packaged application self-test failed: $($process.ExitCode)" }
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: LokantaTakip-Windows-x64
          path: dist/LokantaTakip.exe
          if-no-files-found: error
