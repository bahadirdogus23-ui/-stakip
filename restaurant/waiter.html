<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lokanta • Garson</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f4f5f0;color:#17372d;font:17px system-ui}main{max-width:620px;margin:auto;padding:24px}h1{font-size:28px}input,select,button{width:100%;padding:15px;margin:7px 0;border:1px solid #ccd4ce;border-radius:12px;font:inherit}button{background:#19634d;color:white;border:0;font-weight:700;cursor:pointer}label{display:block;margin-top:14px}article{background:white;border-radius:14px;padding:15px;margin:8px 0}.muted{color:#63766d}#message{padding:12px;white-space:pre-wrap}button:disabled{opacity:.5}</style>
<main><div class="muted">LOKANTA / SERVİS</div><h1>Kolay sipariş, hızlı servis.</h1><section id="login"><p>Kasa ekranındaki bağlantı PIN’ini girin.</p><input id="pin" type="password" inputmode="numeric" placeholder="6 haneli PIN"><button id="enter">Bağlan</button></section><section id="app" hidden><label>Adınız<input id="waiter" maxlength="50" placeholder="Garson adı"></label><label>Bölüm<select id="section"></select></label><label>Masa<select id="table"></select></label><div id="bill"></div><label>Ürün<select id="product"></select></label><label>Adet<input id="qty" type="number" min="1" max="99" value="1"></label><label>Sipariş notu<input id="note" maxlength="300" placeholder="Örn. soğansız"></label><button id="send">Siparişi gönder</button><button id="refresh">Masaları yenile</button><p class="muted">Ödeme ve menü işlemleri kasadan yapılır.</p></section><div id="message" role="status"></div></main>
<script>
let token=sessionStorage.getItem('token')||'',state;const $=id=>document.getElementById(id);const money=n=>(n/100).toLocaleString('tr-TR',{style:'currency',currency:'TRY'});function msg(s){$('message').textContent=s}async function api(path,data){const r=await fetch('/api/'+path,{method:data?'POST':'GET',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:data?JSON.stringify(data):undefined});const b=await r.json();if(!r.ok){if(r.status===401){$('login').hidden=false;$('app').hidden=true}throw Error(b.error)}return b}function bill(){const id=Number($('table').value),t=state.tables.find(t=>t.id===id);$('bill').replaceChildren();for(const i of state.items.filter(i=>i.table_id===id)){let a=document.createElement('article');a.textContent=`${i.qty} × ${i.name} · ${money(i.price*i.qty)} · ${i.state}${i.note?' / '+i.note:''}`;$('bill').append(a)}const p=document.createElement('strong');p.textContent='Masa toplamı: '+money(t?.total||0);$('bill').append(p)}function tables(){const selected=$('table').value;const section=Number($('section').value);$('table').replaceChildren(...state.tables.filter(t=>!section||t.section_id===section).map(t=>new Option(`${t.name} · ${t.order_id?'Dolu':'Boş'} · ${money(t.total)}`,t.id)));if([...$('table').options].some(o=>o.value===selected))$('table').value=selected;bill()}async function refresh(){state=await api('state');const current=$('section').value;$('section').replaceChildren(new Option('Tüm bölümler',0),...state.sections.map(s=>new Option(s.name,s.id)));if([...$('section').options].some(o=>o.value===current))$('section').value=current;tables();$('product').replaceChildren(...state.products.map(p=>new Option(`${p.name} · ${money(p.price)}`,p.id)));$('login').hidden=true;$('app').hidden=false;bill()}$('enter').onclick=async()=>{try{token=(await api('login',{pin:$('pin').value})).token;sessionStorage.setItem('token',token);await refresh();msg('Bağlandı.')}catch(e){msg(e.message)}};$('send').onclick=async()=>{if(!$('waiter').value.trim())return msg('Adınızı girin.');$('send').disabled=true;try{await api('order',{table:Number($('table').value),product:Number($('product').value),qty:Number($('qty').value),note:$('note').value,waiter:$('waiter').value});$('note').value='';await refresh();msg('Sipariş kaydedildi.')}catch(e){msg(e.message)}finally{$('send').disabled=false}};$('refresh').onclick=()=>refresh().catch(e=>msg(e.message));$('table').onchange=bill;$('section').onchange=tables;if(token)refresh().catch(e=>msg(e.message));setInterval(()=>{if(!$('app').hidden)refresh().catch(()=>msg('Bağlantı yok. Sipariş göndermeden önce bağlantıyı kontrol edin.'))},10000);
</script></html>
